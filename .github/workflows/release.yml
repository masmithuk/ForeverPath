name: Release

# Publishing a release on GitHub (Releases > Draft a new release) packages it
# and uploads it to CurseForge. Use a tag that matches "## Version:" in
# Questwalker.toc, with or without a leading v (0.8.5 or v0.8.5). Tags with
# "alpha" or "beta" in them become alpha/beta files.
#
# Also runnable by hand: Actions > Release > Run workflow, for an existing tag.
# If a step fails (e.g. a missing secret), fix it and use "Re-run jobs" on the
# run: every step is safe to repeat.
#
# Needs, under Settings > Secrets and variables > Actions:
#   secret   CF_API_KEY      a CurseForge API token
#   variable CF_PROJECT_ID   the numeric id of the Questwalker CurseForge project
#                            (a secret of the same name, or the older
#                            CURSEFORGE_PROJECT_ID variable, works too)
#
# Adapted from Coin Forge's release setup (scripts/ and docs/RELEASING.md).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, e.g. v0.8.5"
        required: true

permissions:
  contents: write # to create the GitHub release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Work out the tag
        run: echo "TAG=${{ github.event.release.tag_name || inputs.tag }}" >> "$GITHUB_ENV"

      - name: Install Lua 5.1 and luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 lua-check jq zip

      - name: Lint and test
        run: |
          luacheck .
          lua5.1 tests/run.lua

      - name: Package
        id: package
        run: echo "zip=$(scripts/package.sh "$TAG")" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/changelog.sh > release-notes.md
          prerelease=""
          case "$TAG" in *alpha*|*beta*) prerelease="--prerelease" ;; esac
          # safe to re-run: reuse the release if an earlier run already created it
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${{ steps.package.outputs.zip }}" --clobber
            # a release made by hand may have no notes: use the changelog entry
            if [ -z "$(gh release view "$TAG" --json body -q .body)" ]; then
              gh release edit "$TAG" --notes-file release-notes.md
            fi
          else
            gh release create "$TAG" "${{ steps.package.outputs.zip }}" \
              --title "Questwalker ${TAG#v}" --notes-file release-notes.md $prerelease
          fi

      - name: Upload to CurseForge
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          CF_PROJECT_ID: ${{ vars.CF_PROJECT_ID || secrets.CF_PROJECT_ID || vars.CURSEFORGE_PROJECT_ID }}
        run: scripts/upload-curseforge.sh "${{ steps.package.outputs.zip }}" "$TAG"
