name: CI

# Branch pushes and pull requests. Release tags are linted and tested by
# the Release workflow itself, so they aren't run twice.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua 5.1 and luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 lua-check

      - name: Lint
        run: luacheck .

      - name: Test
        run: lua5.1 tests/run.lua
